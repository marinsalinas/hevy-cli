repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - click>=8.1
          - httpx>=0.27
          - pydantic>=2.0
          - rich>=13.0
          - pyyaml>=6.0
          - types-PyYAML>=6.0
          - structlog>=24.0
          - tenacity>=8.0
          - tomli-w>=1.0
          - platformdirs>=4.0
        pass_filenames: false
        args: [src/]
