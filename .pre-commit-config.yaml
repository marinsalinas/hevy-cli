ci:
  # pre-commit.ci config — autofixes and weekly autoupdate PRs.
  autofix_prs: true
  autoupdate_schedule: weekly
  # Skip mypy on pre-commit.ci because deps can't be fully resolved there.
  skip: [mypy]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        additional_dependencies:
          - click>=8.1
          - httpx>=0.27
          - pydantic>=2.0
          - rich>=13.0
          - pyyaml>=6.0
          - types-PyYAML>=6.0
          - structlog>=24.0
          - tenacity>=8.0
          - tomli-w>=1.0
          - platformdirs>=4.0
        pass_filenames: false
        args: [src/]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
