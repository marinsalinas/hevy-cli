name: Feature request
description: Suggest a new capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. A quick note on scope: this CLI exists to wrap the Hevy v1 REST API, so new commands generally need a corresponding upstream endpoint. See [docs/usage.md](https://github.com/marinsalinas/hevy-cli/blob/main/docs/usage.md#api-coverage) for what the Hevy API currently exposes.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user need, not the solution. "I want to export my last month of workouts as CSV so I can analyse volume trends in a spreadsheet."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What command / flag / behaviour would you like to see? Include a concrete usage example if possible.
      render: shell
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fell short.
    validations:
      required: false

  - type: dropdown
    id: upstream
    attributes:
      label: Does the Hevy API already expose this?
      options:
        - "Yes — link in the next field"
        - "No — this would need an upstream API change"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: api-link
    attributes:
      label: Relevant Hevy API endpoint (if any)
      description: Link to the endpoint in the Hevy OpenAPI spec.
      placeholder: "https://api.hevyapp.com/docs#/..."
    validations:
      required: false
