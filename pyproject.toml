[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hevy-cli"
version = "0.1.0"
description = "Production-ready CLI for the Hevy workout tracking API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Marin Salinas", email = "marinssalinas@gmail.com" },
]
keywords = ["hevy", "workout", "fitness", "cli", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[project.urls]
Homepage = "https://github.com/marinsalinas/hevy-cli"
Documentation = "https://github.com/marinsalinas/hevy-cli#readme"
Repository = "https://github.com/marinsalinas/hevy-cli"
Issues = "https://github.com/marinsalinas/hevy-cli/issues"
Changelog = "https://github.com/marinsalinas/hevy-cli/blob/main/CHANGELOG.md"

[project.scripts]
hevy = "hevy_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "pre-commit>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["hevy_cli"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["hevy_cli"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 60
